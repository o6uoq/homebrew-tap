name: Formula smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install ${{ matrix.formula }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formula: openspec
            smoke_cmd: "openspec --help"
          - os: ubuntu-latest
            formula: slidev
            smoke_cmd: "slidev --help"
          - os: ubuntu-latest
            formula: try
            smoke_cmd: "try --help"
          # toad currently vendors macOS arm64 wheels in resources.
          - os: macos-latest
            formula: toad
            smoke_cmd: "toad --help"
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TAP_NAME: "local/tap-ci"
      OFFICIAL_TAP: "${{ github.repository_owner }}/tap"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@04a6d8cfe9d251e2afb78c5bdc6274ec9642aea2

      - name: Tap local repository
        run: |
          if brew tap | grep -Fxq "${TAP_NAME}"; then
            brew untap "${TAP_NAME}"
          fi
          if brew tap | grep -Fxq "${OFFICIAL_TAP}"; then
            brew untap "${OFFICIAL_TAP}"
          fi
          brew tap "${TAP_NAME}" "${GITHUB_WORKSPACE}"

      - name: Install formula
        run: brew install --formula "${TAP_NAME}/${{ matrix.formula }}"

      - name: Run smoke command
        run: ${{ matrix.smoke_cmd }}
