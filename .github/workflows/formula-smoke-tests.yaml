name: Formula smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed formulas
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build formula matrix
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          else
            git fetch --no-tags --depth=1 origin main
            CHANGED_FILES="$(git diff --name-only origin/main...HEAD)"
          fi

          ENTRIES=()
          while IFS= read -r file; do
            [ -f "${file}" ] || continue

            case "${file}" in
              Formula/agent-scan.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"agent-scan","smoke_cmd":"snyk-agent-scan help"}') ;;
              Formula/context-mode.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"context-mode","smoke_cmd":"context-mode --help"}') ;;
              Formula/oh-my-codex.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"oh-my-codex","smoke_cmd":"omx --help"}') ;;
              Formula/openspec.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"openspec","smoke_cmd":"openspec --help"}') ;;
              Formula/skills.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"skills","smoke_cmd":"skills --version"}') ;;
              Formula/fuzmit.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"fuzmit","smoke_cmd":"fuzmit --help"}') ;;
              Formula/slidev.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"slidev","smoke_cmd":"slidev --help"}') ;;
              Formula/try.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"try","smoke_cmd":"try --help"}') ;;
              Formula/toad.rb) ENTRIES+=('{"os":"macos-latest","formula":"toad","smoke_cmd":"toad --help"}') ;;
              Formula/tmux-ide.rb) ENTRIES+=('{"os":"ubuntu-latest","formula":"tmux-ide","smoke_cmd":"tmux-ide --version"}') ;;
            esac
          done <<<"${CHANGED_FILES}"

          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            echo 'count=0' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX_JSON="{\"include\":["
          for i in "${!ENTRIES[@]}"; do
            [ "${i}" -gt 0 ] && MATRIX_JSON+=","
            MATRIX_JSON+="${ENTRIES[$i]}"
          done
          MATRIX_JSON+="]}"

          echo "matrix=${MATRIX_JSON}" >> "${GITHUB_OUTPUT}"
          echo "count=${#ENTRIES[@]}" >> "${GITHUB_OUTPUT}"

  install:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    name: Install ${{ matrix.formula }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TAP_NAME: "${{ github.repository_owner }}/tap"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1

      - name: Restore checkout after Homebrew setup
        run: |
          git -C "${GITHUB_WORKSPACE}" checkout --force "${GITHUB_SHA}"

      - name: Install Linux sandbox runtime
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w user.max_user_namespaces=28633
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install formula
        run: brew install --formula "${TAP_NAME}/${{ matrix.formula }}"

      - name: Run smoke command
        run: ${{ matrix.smoke_cmd }}

  no-changes:
    name: No formula changes
    needs: detect
    if: ${{ needs.detect.outputs.count == '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip smoke tests
        run: echo "No supported formula file changes detected; smoke tests skipped."
