name: Auto-bump formulas
on:
  schedule:
    - cron: '0 0 * * *'  # Nightly at 12am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    # npm preflight checks for min-release-age compliance can extend runtime when multiple bumps are eligible.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Run auto-bump
        id: autobump
        run: ./scripts/auto-bump.sh

      - name: Validate GitHub App configuration
        if: steps.autobump.outputs.changed == 'true'
        env:
          AUTOBUMP_APP_ID: ${{ secrets.AUTOBUMP_APP_ID }}
          AUTOBUMP_APP_PRIVATE_KEY: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${AUTOBUMP_APP_ID}" ] || [ -z "${AUTOBUMP_APP_PRIVATE_KEY}" ]; then
            echo "::error::Missing AUTOBUMP_APP_ID and/or AUTOBUMP_APP_PRIVATE_KEY secrets."
            exit 1
          fi

      - name: Mint short-lived PR token from GitHub App
        id: app_token
        if: steps.autobump.outputs.changed == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.AUTOBUMP_APP_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false

      - name: Create PR
        id: create_pr
        if: steps.autobump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Must use a non-GITHUB_TOKEN actor so PR creation triggers pull_request checks.
          token: ${{ steps.app_token.outputs.token }}
          commit-message: "🧹 chore: bump formula versions"
          committer: "David Dolph <1227896+o6uoq@users.noreply.github.com>"
          author: "David Dolph <1227896+o6uoq@users.noreply.github.com>"
          title: "🧹 Bump formulas"
          body-path: ${{ steps.autobump.outputs.pr_body_path }}
          branch: auto-bump
          delete-branch: true
