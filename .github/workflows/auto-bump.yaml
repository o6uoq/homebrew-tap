name: Auto-bump formulas
on:
  schedule:
    - cron: '0 0 * * *'  # Nightly at 12am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    # Smoke checks currently max at ~4 minutes; keep a safety buffer while bounding token-bearing runtime.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check openspec
        id: openspec
        run: |
          LATEST=$(curl -s https://api.github.com/repos/Fission-AI/OpenSpec/releases/latest | jq -r '.tag_name' | tr -d 'v')
          CURRENT=$(sed -nE 's#.*openspec-([0-9]+\.[0-9]+\.[0-9]+)\.tgz.*#\1#p' Formula/openspec.rb)
          if [ "$LATEST" != "$CURRENT" ]; then
            SHA=$(curl -sL "https://registry.npmjs.org/@fission-ai/openspec/-/openspec-${LATEST}.tgz" | shasum -a 256 | cut -d' ' -f1)
            sed -i "s|openspec-${CURRENT}.tgz|openspec-${LATEST}.tgz|" Formula/openspec.rb
            sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|" Formula/openspec.rb
            echo "bumped=${CURRENT} → ${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Check slidev
        id: slidev
        run: |
          LATEST=$(curl -s https://api.github.com/repos/slidevjs/slidev/releases/latest | jq -r '.tag_name' | tr -d 'v')
          CURRENT=$(sed -nE 's#.*cli-([0-9]+\.[0-9]+\.[0-9]+)\.tgz.*#\1#p' Formula/slidev.rb)
          if [ "$LATEST" != "$CURRENT" ]; then
            SHA=$(curl -sL "https://registry.npmjs.org/@slidev/cli/-/cli-${LATEST}.tgz" | shasum -a 256 | cut -d' ' -f1)
            sed -i "s|cli-${CURRENT}.tgz|cli-${LATEST}.tgz|" Formula/slidev.rb
            sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|" Formula/slidev.rb
            echo "bumped=${CURRENT} → ${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Check fuzmit
        id: fuzmit
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/o6uoq/fuzmit/releases/latest | jq -r '.tag_name' | tr -d 'v')
          CURRENT=$(sed -nE 's#^  version "([0-9]+\.[0-9]+\.[0-9]+)"#\1#p' Formula/fuzmit.rb)
          if [ "$LATEST" != "$CURRENT" ]; then
            DARWIN_AMD64_SHA=$(curl -fsSL "https://github.com/o6uoq/fuzmit/releases/download/v${LATEST}/fuzmit_${LATEST}_darwin_amd64.tar.gz" | shasum -a 256 | cut -d' ' -f1)
            DARWIN_ARM64_SHA=$(curl -fsSL "https://github.com/o6uoq/fuzmit/releases/download/v${LATEST}/fuzmit_${LATEST}_darwin_arm64.tar.gz" | shasum -a 256 | cut -d' ' -f1)
            LINUX_AMD64_SHA=$(curl -fsSL "https://github.com/o6uoq/fuzmit/releases/download/v${LATEST}/fuzmit_${LATEST}_linux_amd64.tar.gz" | shasum -a 256 | cut -d' ' -f1)
            LINUX_ARM64_SHA=$(curl -fsSL "https://github.com/o6uoq/fuzmit/releases/download/v${LATEST}/fuzmit_${LATEST}_linux_arm64.tar.gz" | shasum -a 256 | cut -d' ' -f1)

            perl -0i -pe '
              s#^  version "[0-9]+\.[0-9]+\.[0-9]+"#  version "'"${LATEST}"'"#m;
              s#fuzmit_[0-9]+\.[0-9]+\.[0-9]+_darwin_amd64#fuzmit_'"${LATEST}"'_darwin_amd64#g;
              s#fuzmit_[0-9]+\.[0-9]+\.[0-9]+_darwin_arm64#fuzmit_'"${LATEST}"'_darwin_arm64#g;
              s#fuzmit_[0-9]+\.[0-9]+\.[0-9]+_linux_amd64#fuzmit_'"${LATEST}"'_linux_amd64#g;
              s#fuzmit_[0-9]+\.[0-9]+\.[0-9]+_linux_arm64#fuzmit_'"${LATEST}"'_linux_arm64#g;
              s#/v[0-9]+\.[0-9]+\.[0-9]+/#/v'"${LATEST}"'/#g;
              s#(darwin_amd64\.tar\.gz"\n      sha256 ")[a-f0-9]{64}"#$1'"${DARWIN_AMD64_SHA}"'"#m;
              s#(darwin_arm64\.tar\.gz"\n      sha256 ")[a-f0-9]{64}"#$1'"${DARWIN_ARM64_SHA}"'"#m;
              s#(linux_amd64\.tar\.gz"\n      sha256 ")[a-f0-9]{64}"#$1'"${LINUX_AMD64_SHA}"'"#m;
              s#(linux_arm64\.tar\.gz"\n      sha256 ")[a-f0-9]{64}"#$1'"${LINUX_ARM64_SHA}"'"#m;
            ' Formula/fuzmit.rb

            echo "bumped=${CURRENT} → ${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Check toad
        id: toad
        run: |
          PYPI_JSON=$(curl -fsSL https://pypi.org/pypi/batrachian-toad/json)
          LATEST=$(jq -r '.info.version' <<<"$PYPI_JSON")
          CURRENT=$(sed -nE 's#.*batrachian_toad-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz.*#\1#p' Formula/toad.rb)
          if [ "$LATEST" != "$CURRENT" ]; then
            URL=$(jq -r '[.urls[] | select(.packagetype == "sdist")][0].url' <<<"$PYPI_JSON")
            SHA=$(jq -r '[.urls[] | select(.packagetype == "sdist")][0].digests.sha256' <<<"$PYPI_JSON")

            if [ -z "$URL" ] || [ "$URL" = "null" ] || [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
              echo "Failed to resolve sdist URL or sha256 for batrachian-toad ${LATEST}"
              exit 1
            fi

            perl -0i -pe 's#^  url ".*batrachian_toad-[^"]+\.tar\.gz"#  url "'"${URL}"'"#m; s#^  sha256 "[a-f0-9]{64}"#  sha256 "'"${SHA}"'"#m' Formula/toad.rb

            SHA_COUNT=$(grep -c "sha256 \"${SHA}\"" Formula/toad.rb)
            if [ "$SHA_COUNT" -ne 1 ]; then
              echo "Unexpected sha256 replacement count for toad: ${SHA_COUNT}"
              exit 1
            fi

            echo "bumped=${CURRENT} → ${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Check try
        id: try
        run: |
          LATEST=$(curl -s https://api.github.com/repos/tobi/try/tags | jq -r '.[0].name' | tr -d 'v')
          CURRENT=$(sed -nE 's#.*tags/v([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz.*#\1#p' Formula/try.rb)
          if [ "$LATEST" != "$CURRENT" ]; then
            SHA=$(curl -sL "https://github.com/tobi/try/archive/refs/tags/v${LATEST}.tar.gz" | shasum -a 256 | cut -d' ' -f1)
            sed -i "s|tags/v${CURRENT}|tags/v${LATEST}|" Formula/try.rb
            sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|" Formula/try.rb
            echo "bumped=${CURRENT} → ${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Check tmux-ide
        id: tmux_ide
        run: |
          LATEST=$(curl -fsSL https://registry.npmjs.org/tmux-ide/latest | jq -r '.version')
          CURRENT=$(sed -nE 's#.*tmux-ide-([0-9]+\.[0-9]+\.[0-9]+)\.tgz.*#\1#p' Formula/tmux-ide.rb)
          if [ "$LATEST" != "$CURRENT" ]; then
            SHA=$(curl -fsSL "https://registry.npmjs.org/tmux-ide/-/tmux-ide-${LATEST}.tgz" | shasum -a 256 | cut -d' ' -f1)
            sed -i "s|tmux-ide-${CURRENT}.tgz|tmux-ide-${LATEST}.tgz|" Formula/tmux-ide.rb
            sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|" Formula/tmux-ide.rb
            echo "bumped=${CURRENT} → ${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Validate GitHub App configuration
        if: steps.openspec.outputs.bumped || steps.slidev.outputs.bumped || steps.fuzmit.outputs.bumped || steps.toad.outputs.bumped || steps.try.outputs.bumped || steps.tmux_ide.outputs.bumped
        env:
          AUTOBUMP_APP_ID: ${{ secrets.AUTOBUMP_APP_ID }}
          AUTOBUMP_APP_PRIVATE_KEY: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${AUTOBUMP_APP_ID}" ] || [ -z "${AUTOBUMP_APP_PRIVATE_KEY}" ]; then
            echo "::error::Missing AUTOBUMP_APP_ID and/or AUTOBUMP_APP_PRIVATE_KEY secrets."
            exit 1
          fi

      - name: Mint short-lived PR token from GitHub App
        id: app_token
        if: steps.openspec.outputs.bumped || steps.slidev.outputs.bumped || steps.fuzmit.outputs.bumped || steps.toad.outputs.bumped || steps.try.outputs.bumped || steps.tmux_ide.outputs.bumped
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.AUTOBUMP_APP_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false

      - name: Create PR
        id: create_pr
        if: steps.openspec.outputs.bumped || steps.slidev.outputs.bumped || steps.fuzmit.outputs.bumped || steps.toad.outputs.bumped || steps.try.outputs.bumped || steps.tmux_ide.outputs.bumped
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          # Must use a non-GITHUB_TOKEN actor so PR creation triggers pull_request checks.
          token: ${{ steps.app_token.outputs.token }}
          commit-message: "🧹 chore: bump formula versions"
          title: "🧹 Bump formulas"
          body: |
            **Version bumps:**
            ${{ steps.openspec.outputs.bumped && format('- openspec: {0}', steps.openspec.outputs.bumped) || '' }}
            ${{ steps.slidev.outputs.bumped && format('- slidev: {0}', steps.slidev.outputs.bumped) || '' }}
            ${{ steps.fuzmit.outputs.bumped && format('- fuzmit: {0}', steps.fuzmit.outputs.bumped) || '' }}
            ${{ steps.toad.outputs.bumped && format('- toad: {0}', steps.toad.outputs.bumped) || '' }}
            ${{ steps.try.outputs.bumped && format('- try: {0}', steps.try.outputs.bumped) || '' }}
            ${{ steps.tmux_ide.outputs.bumped && format('- tmux-ide: {0}', steps.tmux_ide.outputs.bumped) || '' }}

            @o6uoq
          branch: auto-bump
          delete-branch: true
